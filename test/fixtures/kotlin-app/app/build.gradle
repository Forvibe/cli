plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.forvibe.fixture.kotlin'
    compileSdk 34

    defaultConfig {
        applicationId "com.forvibe.fixture.kotlin"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.android.billingclient:billing:6.1.0'
}
